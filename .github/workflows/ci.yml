name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-validation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen ruff check src tests
      - run: uv run --frozen ruff format --check src tests
      - run: uv run --frozen pytest -q
      - run: uv run --frozen tass validate --config configs/town.yaml
      - run: uv run --frozen tass run --config configs/smoke.yaml --output runs/ci-smoke
      - run: uv run --frozen tass replay runs/ci-smoke --tick 2
      - run: uv build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.os }}
          path: |
            runs/ci-smoke/metrics.csv
            runs/ci-smoke/run.json
            dist/*
